const log=m=>{document.getElementById('log').textContent+=m+"\n";};
const CDN=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
           'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'];
function loadSb(i){i=i||0;return new Promise((res,rej)=>{if(window.supabase&&window.supabase.createClient)return res();
  if(i>=CDN.length)return rej(new Error('supabase-js CDN blocked — turn on Cloudflare WARP'));
  var s=document.createElement('script');s.src=CDN[i];
  s.onload=()=>window.supabase&&window.supabase.createClient?res():loadSb(i+1).then(res,rej);
  s.onerror=()=>loadSb(i+1).then(res,rej);document.head.appendChild(s);});}
document.getElementById('go').onclick=async()=>{
 var btn=document.getElementById('go');btn.disabled=true;
 try{
  document.getElementById('status').textContent='Loading library…'; await loadSb();
  var sb=window.supabase.createClient(SB_URL,SB_KEY);
  var B=200, done=0, total=ROWS.length;
  for(var i=0;i<total;i+=B){
    var batch=ROWS.slice(i,i+B);
    var r=await sb.from('si_vehicles').upsert(batch,{onConflict:'id'});
    if(r.error){throw new Error('Insert failed: '+r.error.message+(r.error.code?(' [code '+r.error.code+']'):'')+
      (String(r.error.message).match(/policy|denied|row-level/i)?' — run si_vehicles_schema_only.sql first (anon policy missing).':''));}
    done+=batch.length;
    document.getElementById('fill').style.width=Math.round(done/total*100)+'%';
    document.getElementById('status').textContent='Uploaded '+done+' / '+total+'…';
  }
  document.getElementById('status').innerHTML='<span class="ok">Upload complete.</span>';
  var c=await sb.from('si_vehicles').select('*',{count:'exact',head:true});
  document.getElementById('count').textContent=c.count;
  document.getElementById('count').className='big '+(c.count>=total?'ok':'bad');
  log('Done. Now open the app and fully reload — you should see ~'+c.count+' vehicles.');
 }catch(e){
  document.getElementById('status').innerHTML='<span class="bad">'+e.message+'</span>';
  log('FAILED: '+e.message); btn.disabled=false;
 }
};
})();

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Inclusive — Cloud Check</title>
<style>
 body{font:16px/1.5 -apple-system,system-ui,sans-serif;margin:0;background:#0b1220;color:#e7eefc;padding:18px}
 h1{font-size:18px;margin:0 0 4px}.sub{color:#9fb0d0;font-size:13px;margin-bottom:16px}
 .card{background:#141d31;border:1px solid #243a5e;border-radius:14px;padding:16px;margin:12px 0}
 .row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid #243a5e}
 .row b{font-size:30px}.muted{color:#9fb0d0;font-size:13px}.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#fbbf24}
 #log{white-space:pre-wrap;font-size:12px;color:#9fb0d0}
</style></head><body>
<h1>Service Inclusive — Cloud Check</h1>
<div class="sub">Read-only. Counts exactly what is in the cloud right now.</div>
<div class="card"><div id="conn">⏳ Connecting…</div></div>
<div class="card">
 <div class="row"><span>si_vehicles</span><b id="v">—</b></div>
 <div class="row"><span>si_packages</span><b id="p">—</b></div>
 <div class="row"><span>si_services</span><b id="s">—</b></div>
</div>
<div class="card"><div class="muted">Vehicles by source</div><div id="src" class="muted">—</div></div>
<div class="card"><div id="log"></div></div>
<script>
(function(){
const SB_URL="https://egcbbfiqzaccsquaytvz.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnY2JiZmlxemFjY3NxdWF5dHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDE1MzgsImV4cCI6MjA5MjY3NzUzOH0.2qLR3uLTE8C2tKSQUEV-9q2DF8Hrfad08UQoLv5Q72c";
const log=m=>{document.getElementById('log').textContent+=m+"\n";};
const CDN=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
           'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'];
function loadSb(i){i=i||0;return new Promise((res,rej)=>{if(window.supabase&&window.supabase.createClient)return res();
  if(i>=CDN.length)return rej(new Error('supabase-js CDN blocked — turn on Cloudflare WARP'));
  var sc=document.createElement('script');sc.src=CDN[i];
  sc.onload=()=>window.supabase&&window.supabase.createClient?res():loadSb(i+1).then(res,rej);
  sc.onerror=()=>loadSb(i+1).then(res,rej);document.head.appendChild(sc);});}
async function cnt(sb,t){const r=await sb.from(t).select('*',{count:'exact',head:true});if(r.error)throw new Error(t+': '+r.error.message);return r.count;}
(async()=>{try{
  log('Loading library…'); await loadSb();
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  document.getElementById('conn').innerHTML='<span class="ok">✅ Connected (anon)</span>';
  const v=await cnt(sb,'si_vehicles');document.getElementById('v').textContent=v;document.getElementById('v').className=v>=3000?'ok':(v>0?'warn':'bad');
  let p='n/a',s='n/a';
  try{p=await cnt(sb,'si_packages');}catch(e){p='—';log('packages: '+e.message);}
  try{s=await cnt(sb,'si_services');}catch(e){s='—';log('services: '+e.message);}
  document.getElementById('p').textContent=p;document.getElementById('s').textContent=s;
  // vehicles by source
  const {data}=await sb.from('si_vehicles').select('source');
  const t={};(data||[]).forEach(r=>{const k=r.source||'(none/demo)';t[k]=(t[k]||0)+1;});
  document.getElementById('src').textContent=Object.entries(t).map(([k,n])=>k+': '+n).join('   ')||'—';
  log('Done.');
}catch(e){document.getElementById('conn').innerHTML='<span class="bad">❌ '+e.message+'</span>';log('FAILED: '+e.message);}})();
})();
</script>  <script src="analytics.js?v=1" data-site="bassoul-heneine"></script>
</body></html>
